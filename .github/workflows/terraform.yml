name: AWS CI/CD Pipeline

on:
  workflow_dispatch:
    inputs:
      bucket_name:
        description: 'S3 Bucket Name for script upload'
        required: true
        type: string
        default: 'm2-cloud-logs--name'

env:
  AWS_REGION: us-west-1

jobs:
  validate:
    runs-on: ubuntu-latest
    container:
      image: amazon/aws-cli:latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      
      - name: Configure AWS credentials
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_KEY }}
        run: |
          aws configure set aws_access_key_id $AWS_ACCESS_KEY_ID
          aws configure set aws_secret_access_key $AWS_SECRET_ACCESS_KEY
          aws configure set region $AWS_REGION
      
      - name: Validate AWS credentials
        run: aws sts get-caller-identity

  deploy:
    runs-on: ubuntu-latest
    container:
      image: amazon/aws-cli:latest
    needs: validate
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      
      - name: Configure AWS credentials
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_KEY }}
        run: |
          aws configure set aws_access_key_id $AWS_ACCESS_KEY_ID
          aws configure set aws_secret_access_key $AWS_SECRET_ACCESS_KEY
          aws configure set region $AWS_REGION
      
      - name: Package Lambda function
        run: zip function.zip lambda_function.py
      
      - name: Deploy Lambda function
        run: |
          aws lambda update-function-code \
            --function-name stop-ec2 \
            --zip-file fileb://function.zip

  upload:
    runs-on: ubuntu-latest
    container:
      image: amazon/aws-cli:latest
    needs: [validate, deploy]
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      
      - name: Configure AWS credentials
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_KEY }}
        run: |
          aws configure set aws_access_key_id $AWS_ACCESS_KEY_ID
          aws configure set aws_secret_access_key $AWS_SECRET_ACCESS_KEY
          aws configure set region $AWS_REGION
      
      - name: Upload script to S3
        run: |
          aws s3 cp script.sh s3://${{ github.event.inputs.bucket_name }}/
