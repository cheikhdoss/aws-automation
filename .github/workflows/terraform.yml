name: AWS CI/CD Pipeline

on:
  workflow_dispatch:
    inputs:
      bucket_name:
        description: 'S3 Bucket Name for script upload'
        required: true
        type: string
        default: 'm2-cloud-logs--name'

env:
  AWS_REGION: us-west-1

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      
      - name: Configure AWS CLI
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_KEY }}
          aws-region: ${{ env.AWS_REGION }}
      
      - name: Validate AWS credentials
        run: aws sts get-caller-identity

  deploy:
    runs-on: ubuntu-latest
    needs: validate
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      
      - name: Configure AWS CLI
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_KEY }}
          aws-region: ${{ env.AWS_REGION }}
      
      - name: Package Lambda function
        run: zip function.zip lambda_function.py
      
      - name: Deploy Lambda function
        run: |
          aws lambda update-function-code \
            --function-name stop-ec2 \
            --zip-file fileb://function.zip

  upload:
    runs-on: ubuntu-latest
    needs: [validate, deploy]
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      
      - name: Configure AWS CLI
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_KEY }}
          aws-region: ${{ env.AWS_REGION }}
      
      - name: Upload script to S3
        run: |
          aws s3 cp script.sh s3://${{ github.event.inputs.bucket_name }}/
