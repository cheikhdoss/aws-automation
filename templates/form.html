<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Pipeline AWS CI/CD</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f7f9fb;
            padding: 40px;
            font-family: Georgia, 'Times New Roman', Times, serif;
        }

        .container {
            background-color: #fff;
            padding: 30px;
            border-radius: 10px;
            max-width: 500px;
            margin: auto;
            box-shadow: 0 0 15px rgba(0,0,0,0.1);
        }

        h2 {
            text-align: center;
            color: #333;
        }

        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
            color: #444;
        }

        input, select, button {
            width: 100%;
            padding: 10px;
            margin-bottom: 20px;
            border-radius: 6px;
            border: 1px solid #ccc;
            font-size: 14px;
        }

        button {
            background-color: #007bff;
            color: white;
            border: none;
            cursor: pointer;
        }

        button:hover {
            background-color: #0056b3;
        }
    </style>
</head>
<body>
    <div class="container">
        <h2>PIPELINE AWS CI/CD</h2>
        <p>Ce pipeline va exécuter :</p>
        <ul>
            <li>✅ Validation des credentials AWS</li>
            <li>🚀 Déploiement de la fonction Lambda stop-ec2</li>
            <li>📂 Upload du script EC2 vers S3</li>
        </ul>
        <form method="post" action="/trigger">
            <label for="bucket_name">Nom du bucket S3 :</label>
            <input id="bucket_name" name="bucket_name" value="m2-cloud-logs--name" required>

            <button type="submit">Déclencher le Pipeline</button>
        </form>
    </div>
</body>
</html>
