<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Créer un bucket S3 public</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f7f9fb;
            padding: 40px;
            font-family: Georgia, 'Times New Roman', Times, serif;
        }

        .container {
            background-color: #fff;
            padding: 30px;
            border-radius: 10px;
            max-width: 500px;
            margin: auto;
            box-shadow: 0 0 15px rgba(0,0,0,0.1);
        }

        h2 {
            text-align: center;
            color: #333;
        }

        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
            color: #444;
        }

        input, select, button {
            width: 100%;
            padding: 10px;
            margin-bottom: 20px;
            border-radius: 6px;
            border: 1px solid #ccc;
            font-size: 14px;
        }

        button {
            background-color: #007bff;
            color: white;
            border: none;
            cursor: pointer;
        }

        button:hover {
            background-color: #0056b3;
        }
    </style>
</head>
<body>
    <div class="container">
        <h2>PROJET IAC SONATEL: CRÉATION D'UN BUCKET S3 PUBLIC</h2>
        <form method="post" action="/trigger" enctype="multipart/form-data">

            <label for="bucket_name">Nom du bucket :</label>
            <input id="bucket_name" name="bucket_name" placeholder="ex: mon-bucket-public" required>

            <label for="html_file">Fichier HTML (sera publié comme index.html) :</label>
            <input id="html_file" name="html_file" type="file" accept=".html,text/html" required>

            <button type="submit">Créer le bucket et publier</button>
        </form>
    </div>
</body>
</html>
