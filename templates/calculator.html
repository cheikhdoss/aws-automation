<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Calculatrice</title>
  <style>
    :root {
      --bg: #0f172a;
      --panel: #111827;
      --display: #0b1020;
      --accent: #22d3ee;
      --btn: #1f2937;
      --btn-hover: #2b3a55;
      --text: #e5e7eb;
      --muted: #94a3b8;
      --danger: #ef4444;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: radial-gradient(circle at top, #1e293b, var(--bg));
      font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
      color: var(--text);
    }

    .calculator {
      width: 320px;
      background: var(--panel);
      border-radius: 16px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.4);
      padding: 20px;
      display: grid;
      gap: 14px;
    }

    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .header h1 {
      font-size: 18px;
      margin: 0;
      letter-spacing: 0.4px;
    }

    .badge {
      background: rgba(34, 211, 238, 0.15);
      color: var(--accent);
      padding: 4px 10px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 600;
    }

    .display {
      background: var(--display);
      border-radius: 12px;
      padding: 16px;
      text-align: right;
      min-height: 86px;
      display: grid;
      align-content: center;
    }

    .display .previous {
      font-size: 14px;
      color: var(--muted);
      min-height: 18px;
      word-break: break-all;
    }

    .display .current {
      font-size: 32px;
      font-weight: 600;
      word-break: break-all;
    }

    .keys {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 10px;
    }

    button {
      background: var(--btn);
      border: none;
      border-radius: 12px;
      padding: 14px;
      color: var(--text);
      font-size: 18px;
      cursor: pointer;
      transition: transform 0.08s ease, background 0.2s ease;
    }

    button:hover {
      background: var(--btn-hover);
    }

    button:active {
      transform: scale(0.97);
    }

    .accent {
      color: #0f172a;
      background: var(--accent);
      font-weight: 700;
    }

    .accent:hover {
      background: #38e0f6;
    }

    .danger {
      background: rgba(239, 68, 68, 0.2);
      color: #fca5a5;
    }

    .span-2 {
      grid-column: span 2;
    }
  </style>
</head>
<body>
  <div class="calculator">
    <div class="header">
      <h1>Calculatrice</h1>
      <span class="badge">HTML • CSS • JS</span>
    </div>
    <div class="display" aria-live="polite">
      <div class="previous" id="previous"></div>
      <div class="current" id="current">0</div>
    </div>
    <div class="keys">
      <button class="danger" data-action="clear">C</button>
      <button class="danger" data-action="delete">⌫</button>
      <button data-action="percent">%</button>
      <button data-action="operator" data-value="/">÷</button>

      <button data-action="number" data-value="7">7</button>
      <button data-action="number" data-value="8">8</button>
      <button data-action="number" data-value="9">9</button>
      <button data-action="operator" data-value="*">×</button>

      <button data-action="number" data-value="4">4</button>
      <button data-action="number" data-value="5">5</button>
      <button data-action="number" data-value="6">6</button>
      <button data-action="operator" data-value="-">−</button>

      <button data-action="number" data-value="1">1</button>
      <button data-action="number" data-value="2">2</button>
      <button data-action="number" data-value="3">3</button>
      <button data-action="operator" data-value="+">+</button>

      <button class="span-2" data-action="number" data-value="0">0</button>
      <button data-action="decimal" data-value=",">.</button>
      <button class="accent" data-action="equals">=</button>
    </div>
  </div>

  <script>
    const previousEl = document.getElementById("previous");
    const currentEl = document.getElementById("current");
    const keys = document.querySelector(".keys");

    let current = "0";
    let previous = "";
    let operator = "";
    let justEvaluated = false;

    const updateDisplay = () => {
      previousEl.textContent = previous;
      currentEl.textContent = current;
    };

    const resetCalculator = () => {
      current = "0";
      previous = "";
      operator = "";
      justEvaluated = false;
      updateDisplay();
    };

    const deleteLast = () => {
      if (justEvaluated) {
        resetCalculator();
        return;
      }
      current = current.length > 1 ? current.slice(0, -1) : "0";
      updateDisplay();
    };

    const appendNumber = (value) => {
      if (justEvaluated) {
        current = "0";
        justEvaluated = false;
      }
      if (current === "0") {
        current = value;
      } else {
        current += value;
      }
      updateDisplay();
    };

    const appendDecimal = () => {
      if (justEvaluated) {
        current = "0";
        justEvaluated = false;
      }
      if (!current.includes(".")) {
        current += ".";
        updateDisplay();
      }
    };

    const chooseOperator = (value) => {
      if (operator && previous && !justEvaluated) {
        evaluate();
      }
      operator = value;
      previous = `${current} ${operator}`;
      current = "0";
      updateDisplay();
    };

    const evaluate = () => {
      if (!operator) return;
      const prevValue = parseFloat(previous.split(" ")[0]);
      const currentValue = parseFloat(current);
      if (Number.isNaN(prevValue) || Number.isNaN(currentValue)) return;

      let result;
      switch (operator) {
        case "+":
          result = prevValue + currentValue;
          break;
        case "-":
          result = prevValue - currentValue;
          break;
        case "*":
          result = prevValue * currentValue;
          break;
        case "/":
          result = currentValue === 0 ? "Erreur" : prevValue / currentValue;
          break;
        default:
          return;
      }

      current = typeof result === "number" ? `${result}` : result;
      previous = "";
      operator = "";
      justEvaluated = true;
      updateDisplay();
    };

    const applyPercent = () => {
      const value = parseFloat(current);
      if (Number.isNaN(value)) return;
      current = `${value / 100}`;
      updateDisplay();
    };

    keys.addEventListener("click", (event) => {
      const button = event.target.closest("button");
      if (!button) return;

      const action = button.dataset.action;
      const value = button.dataset.value;

      switch (action) {
        case "number":
          appendNumber(value);
          break;
        case "decimal":
          appendDecimal();
          break;
        case "operator":
          chooseOperator(value);
          break;
        case "equals":
          evaluate();
          break;
        case "clear":
          resetCalculator();
          break;
        case "delete":
          deleteLast();
          break;
        case "percent":
          applyPercent();
          break;
        default:
          break;
      }
    });

    document.addEventListener("keydown", (event) => {
      const key = event.key;
      if (/\d/.test(key)) {
        appendNumber(key);
        return;
      }
      if (key === ".") {
        appendDecimal();
        return;
      }
      if (["+", "-", "*", "/"].includes(key)) {
        chooseOperator(key);
        return;
      }
      if (key === "Enter" || key === "=") {
        event.preventDefault();
        evaluate();
        return;
      }
      if (key === "Backspace") {
        deleteLast();
        return;
      }
      if (key.toLowerCase() === "c") {
        resetCalculator();
      }
    });

    updateDisplay();
  </script>
</body>
</html>
